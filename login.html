<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="icon" href="images/nav_tab_logo.png">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <meta name="keywords" content="Nature Travel, Nature Travel Group">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">
            <img src="images/N2.png" alt="Nature_logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-items">Home</a></li>
            <li><a href="#" class="nav-items">Destinations</a></li>
            <li><a href="#" class="nav-items">Package</a></li>
            <li><a href="#" class="nav-items">Blog</a></li>
            <li><a href="#" class="nav-items">About</a></li>
            <li><a href="#" class="nav-items">Contact</a></li>
            <li><a href="login.html" class="nav-items active">Login</a></li>
            <li><a href="#" class="nav-items" id="nav-btn">Get Started</a></li>
        </ul>
    </nav>
    <div class="form-section">
    <form action="">
            <h1>Welcome!</h1>
            <p>Please enter your personal information.</p>
        <div class="text-container">
            <div class="form-text">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email">
            </div>
            <div class="form-text">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password">
            </div>
            <div class="options">
                <div>
                    <input type="checkbox" id="checkbox">
                    <label for="checkbox">Remember me</label>
                </div>
                    <a href="#">Forgot Passowrd?</a>
            </div>
            <button type="submit">Login</button>
        </div>
        <label for="" class="register">Do not have an account?<a href="#">Register</a></label>
    </form>
    </div>
</body>
</html>
